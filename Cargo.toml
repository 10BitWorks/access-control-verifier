[package]
name = "access-control-verifier"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "verifier"
path = "src/main.rs"

[[bin]]
name = "emqx-device"
path = "src/bin/emqx_device.rs"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
axum = "0.8.1"
rumqttc = { version = "0.24.0", default-features = false, features = ["use-rustls"] }
rustls = "0.23.23"
rusqlite = { version = "0.33.0", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json"] }
aes = "0.8.4"
cmac = "0.7.2"
subtle = "2.6.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
hex = "0.4.3"
oauth2 = "5.0.0"
clap = { version = "4.5.28", features = ["derive", "env"] }
anyhow = "1.0.95"
thiserror = "2.0.11"
chrono = "0.4.38"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
jsonwebtoken = "11.1.0"
cookie = { version = "0.18.2", features = ["signed"] }
base64 = "0.23.1"

[dev-dependencies]
wiremock = "0.6.2"
tempfile = "3.16.0"
tokio-test = "0.4.4"
http-body-util = "0.1.2"
tower = { version = "0.5.3", features = ["util"] }
